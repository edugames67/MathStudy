<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cheesy dih</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  darkMode: 'class'
}
</script>

</head>

<body class="bg-slate-100 text-slate-800 transition">

<div class="max-w-6xl mx-auto p-4">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">cheesy dih</h1>

    <button id="darkModeToggle"
      class="px-4 py-2 bg-indigo-500 text-white rounded-lg">
      Toggle
    </button>
  </div>

  <!-- CONTROLS -->
  <div class="bg-white p-4 rounded-xl shadow mb-6 space-y-4">

    <input id="searchBar"
      placeholder="Search..."
      class="w-full px-4 py-2 border rounded-lg"
      oninput="filterZones()"
    >

    <div class="flex justify-between items-center flex-wrap gap-3">

      <div class="flex gap-2" id="dataButtons">
        <button onclick="saveData()" class="px-4 py-2 bg-green-500 text-white rounded">Save</button>

        <label class="px-4 py-2 bg-blue-500 text-white rounded cursor-pointer">
          Load
          <input type="file" onchange="loadData(event)" hidden>
        </label>
      </div>

      <select id="sortOptions"
        onchange="sortZones()"
        class="px-4 py-2 border rounded-lg">
        <option value="name">Name</option>
        <option value="id">ID</option>
        <option value="popular">Popular</option>
      </select>

    </div>

  </div>

  <!-- COUNT -->
  <div id="zoneCount" class="mb-4 text-sm text-gray-500"></div>

  <!-- GRID -->
  <div id="container"
    class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
  </div>

</div>

<!-- MODAL (IMPORTANT: structure JS expects) -->
<div id="zoneViewer"
  class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">

  <div class="w-[90%] h-[90%] bg-white rounded-xl flex flex-col overflow-hidden">

    <!-- TOP BAR -->
    <div id="zoneInfo" class="flex justify-between items-center p-2 bg-gray-200">

      <div>
        <span id="zoneName"></span>
        <span id="zoneId" class="text-gray-500 ml-2"></span>
      </div>

      <div id="controls" class="flex gap-2">
        <button onclick="aboutBlank()">Open</button>
        <button onclick="fullscreenZone()">Fullscreen</button>
        <button onclick="closeZone()">Close</button>
      </div>

    </div>

    <!-- IFRAME (THIS WAS MISSING / WRONG BEFORE) -->
    <iframe id="zoneFrame" class="flex-1 w-full"></iframe>

  </div>
</div>

<script>
const darkModeToggle = document.getElementById('darkModeToggle');

darkModeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark-mode'); // KEEP THIS (your JS expects it)
});
</script>

<!-- YOUR ORIGINAL JS FILE HERE -->
<script src="script.js"></script>

</body>
</html>
