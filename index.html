<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>cheesy dih</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#0ea5e9',
            accent: '#f59e0b',
            surface: '#0f172a',
            card: '#1e293b'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-100 dark:bg-surface text-slate-800 dark:text-slate-200 transition-colors duration-300">

  <!-- APP WRAPPER -->
  <div class="max-w-6xl mx-auto px-4 py-6">

    <!-- HEADER -->
    <header class="mb-8 flex items-center justify-between">
      <h1 class="text-3xl font-bold tracking-tight text-primary">
        cheesy dih
      </h1>

      <button id="darkModeToggle"
        class="px-4 py-2 rounded-lg bg-primary text-white hover:bg-indigo-500 transition">
        Toggle
      </button>
    </header>

    <!-- SEARCH + CONTROLS -->
    <div class="bg-white dark:bg-card rounded-xl shadow p-4 mb-6 space-y-4">

      <input
        id="searchBar"
        type="text"
        placeholder="Search zones..."
        class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent focus:outline-none focus:ring-2 focus:ring-primary"
      />

      <div class="flex flex-col sm:flex-row gap-3 justify-between">

        <div class="flex gap-2">
          <button class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg">
            Save
          </button>

          <button class="px-4 py-2 bg-secondary hover:bg-sky-500 text-white rounded-lg">
            Load
          </button>

          <input type="file" class="hidden" />
        </div>

        <select
          id="sortOptions"
          class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent"
        >
          <option value="name">Sort by Name</option>
          <option value="id">Sort by ID</option>
        </select>

      </div>
    </div>

    <!-- COUNT -->
    <div id="zoneCount" class="text-sm text-slate-500 mb-4"></div>

    <!-- GRID -->
    <div id="container"
      class="grid gap-5 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">

      <!-- CARD EXAMPLE -->
      <div class="bg-white dark:bg-card rounded-xl shadow hover:shadow-lg transition overflow-hidden group">

        <img src="https://via.placeholder.com/300"
          class="w-full h-32 object-cover group-hover:scale-105 transition duration-300" />

        <div class="p-3 space-y-2">
          <div class="font-semibold">Zone Name</div>

          <button
            class="w-full py-2 bg-primary hover:bg-indigo-500 text-white rounded-lg text-sm">
            Open
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL -->
  <div id="zoneViewer"
    class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">

    <div class="w-[90%] h-[90%] bg-white dark:bg-card rounded-xl overflow-hidden flex flex-col shadow-2xl">

      <!-- HEADER -->
      <div class="flex justify-between items-center px-4 py-3 border-b dark:border-slate-700">

        <div class="font-semibold">
          <span id="zoneName">Zone</span>
          <span id="zoneId" class="text-sm text-slate-400 ml-2"></span>
        </div>

        <div class="flex gap-2">
          <button class="px-3 py-1 bg-slate-200 dark:bg-slate-700 rounded">⛶</button>
          <button class="px-3 py-1 bg-red-500 text-white rounded">✕</button>
        </div>

      </div>

      <!-- IFRAME -->
      <iframe id="zoneFrame" class="flex-1 w-full"></iframe>

    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    const toggle = document.getElementById("darkModeToggle");
    toggle.onclick = () => {
      document.body.classList.toggle("dark");
    };
  </script>

</body>
</html>
