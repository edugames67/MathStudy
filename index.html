<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gn-math</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-mode">

    <!-- HEADER -->
    <header class="app-header">
        <h1>gn-math</h1>
    </header>

    <!-- AD (TOP) -->
    <div class="ad-container">
        <iframe src="https://democratmachinesucceed.com/km9dvd7fp?key=51c9dd135146d5d93f5886779fc2b354"></iframe>
    </div>

    <!-- MAIN -->
    <main class="app-container">

        <!-- SEARCH -->
        <div class="search-wrapper">
            <input 
                type="text" 
                id="searchBar" 
                placeholder="Search zones..." 
                onkeyup="filterZones()"
            >
        </div>

        <!-- CONTROLS -->
        <div class="controls">

            <div class="data-buttons">
                <button onclick="saveData()">💾 Save</button>
                <button onclick="document.getElementById('file').click()">📂 Load</button>
                <input type="file" id="file" hidden onchange="loadData(event)">
            </div>

            <select id="sortOptions" onchange="sortZones()">
                <option value="name">Sort by Name</option>
                <option value="id">Sort by ID</option>
                <option value="popular">Sort by Popularity</option>
            </select>

        </div>

        <!-- ZONE GRID -->
        <section class="zone-wrapper">
            <div id="zoneCount" class="zone-count"></div>
            <div id="container" class="zone-grid">
                <div class="loading">Loading zones...</div>
            </div>
        </section>

    </main>

    <!-- MODAL -->
    <div id="zoneViewer" class="modal">

        <div class="modal-content">

            <!-- HEADER -->
            <div id="zoneInfo" class="modal-header">
                <div>
                    <span id="zoneName"></span>
                    <span id="zoneId"></span>
                </div>

                <div class="modal-controls">
                    <button onclick="closeZone()">✖</button>
                    <button onclick="fullscreenZone()">⛶</button>
                    <button onclick="aboutBlank()">about:blank</button>
                </div>
            </div>

            <!-- CONTENT -->
            <iframe id="zoneFrame"></iframe>

        </div>

    </div>

    <!-- DARK MODE -->
    <button id="darkModeToggle">🌙</button>

    <!-- AD (BOTTOM) -->
    <div class="ad-container">
        <iframe src="https://democratmachinesucceed.com/km9dvd7fp?key=51c9dd135146d5d93f5886779fc2b354"></iframe>
    </div>

    <script src="script.js"></script>

</body>
</html>
